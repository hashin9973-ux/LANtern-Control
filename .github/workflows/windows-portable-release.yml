name: Windows portable release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/windows-portable-release.yml
      - src/**
      - tests/**
      - scripts/publish.ps1
      - scripts/verify-msi-installer.ps1
      - installer/**
      - README.md
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/windows-portable-release.yml
      - src/**
      - tests/**
      - scripts/publish.ps1
      - scripts/verify-msi-installer.ps1
      - installer/**
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-v0.1.13
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 8.0.x

      - name: Test Core
        run: dotnet test .\tests\Lantern.Core.Tests\Lantern.Core.Tests.csproj -c Release
        shell: pwsh

      - name: Test Windows application
        run: dotnet test .\tests\Lantern.App.Tests\Lantern.App.Tests.csproj -c Release
        shell: pwsh

      - name: Test Linux application
        run: dotnet test .\tests\Lantern.Linux.Tests\Lantern.Linux.Tests.csproj -c Release
        shell: pwsh

      - name: Verify installer and release version metadata
        run: .\scripts\verify-msi-installer.ps1
        shell: pwsh

      - name: Publish self-contained Windows application
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish .\src\Lantern.App\Lantern.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugSymbols=false -p:DebugType=None -o .\release
          if ($LASTEXITCODE -ne 0) { throw "Windows publish failed." }
          if (-not (Test-Path ".\release\LANtern Control.exe")) { throw "Published executable is missing." }
          if (-not (Test-Path ".\release\THIRD-PARTY-NOTICES.txt")) { throw "Third-party notices are missing from the portable payload." }
        shell: pwsh

      - name: Create portable ZIP
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path .\outputs -Force | Out-Null
          $archive = ".\outputs\LANtern-Control-v0.1.13-win-x64.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path .\release\* -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path $archive)) { throw "Portable ZIP was not created." }
          Get-Item $archive | Format-List FullName, Length
          Get-FileHash $archive -Algorithm SHA256 | Format-List
        shell: pwsh

      - name: Build Windows MSI installer
        run: |
          $ErrorActionPreference = "Stop"
          dotnet build .\installer\LanternControl.wixproj -c Release -p:InstallerPlatform=x64 -p:PublishDir="$((Resolve-Path .\release).Path)\"
          if ($LASTEXITCODE -ne 0) { throw "Windows MSI compilation failed." }
          $builtInstaller = ".\packaging\wix\LANtern-Control-Setup-v0.1.13.msi"
          $installer = ".\outputs\LANtern-Control-Setup-v0.1.13.msi"
          if (-not (Test-Path $builtInstaller)) { throw "Compiled MSI is missing: $builtInstaller" }
          Copy-Item -LiteralPath $builtInstaller -Destination $installer -Force
          Get-Item $installer | Format-List FullName, Length
          Get-FileHash $installer -Algorithm SHA256 | Format-List
        shell: pwsh

      - name: Upload Windows portable and MSI artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: LANtern-Control-v0.1.13-Windows-x64
          path: |
            .\outputs\LANtern-Control-v0.1.13-win-x64.zip
            .\outputs\LANtern-Control-Setup-v0.1.13.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: v0.1.13
          target_commitish: master
          name: LANtern Control v0.1.13
          body: |
            Windows x64 portable ZIP and MSI installer.

            Improves live ARP enforcement with bounded retries for transient Npcap send failures and supervised background loops that report faults instead of silently stopping. Also keeps startup discovery passive while retaining explicit device scans.
          generate_release_notes: true
          files: .\outputs\LANtern-Control-v0.1.13-win-x64.zip
          fail_on_unmatched_files: true
          make_latest: true
